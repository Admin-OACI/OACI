yaml
name: Sync published site

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python extract.py
      - name: Commit changes
        run: |
          git config user.name "OACI sync"
          git config user.email "actions@users.noreply.github.com"
          git add pages images
          git diff --cached --quiet || git commit -m "Nightly site sync"
          git push
